<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Добавить в календарь · DT School</title>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #b2f70f; --card: #1a1a1a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 8px; background: #000; color: #fff; font: 400 16px/22px "Onest", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .card { width: 100%; max-width: 480px; padding: 36px 20px 28px; border-radius: 20px; background: var(--card); text-align: center; }
    h1 { margin: 0; font-weight: 300; font-size: 28px; line-height: 32px; letter-spacing: -0.03em; }
    .accent { color: var(--accent); }
    p { margin: 14px 0 0; color: rgba(255, 255, 255, .6); }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 28px; padding: 18px 20px; border-radius: 12px; background: #b2f610; color: #000; font-weight: 500; font-size: 17px; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Добавляем встречи <span class="accent">в&nbsp;календарь</span></h1>
    <p>Сейчас откроется окно Календаря, нажмите «Добавить все». Если не открылось, нажмите кнопку ниже.</p>
    <a class="btn" href="dt-school-demo-apasova.ics">Добавить в&nbsp;календарь</a>
  </main>
  <script>setTimeout(function () { location.href = 'dt-school-demo-apasova.ics'; }, 500);</script>
</body>
</html>
